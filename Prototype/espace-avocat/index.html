<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>ProLex Espace Avocat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout : coque d'application — rail latéral ≥ 960px, barre d'onglets basse sur mobile ; colonne de contenu max 1180px */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface-2:#e8edf1; --line:#d3dce2;
  --fg:#13202a; --muted:#56656f;
  --ink:#17405f; --ink-hover:#0e304b; --on-ink:#ffffff;
  --brass:#946417;
  --ok:#16774a; --warn:#b05800; --danger:#b3261e; --info:#2a5c99;
  --paper:#fbf9f2; --paper-fg:#23211c; --paper-line:#e2dbc8;
  --shadow:0 1px 2px rgb(16 32 48 / .06), 0 6px 20px rgb(16 32 48 / .07);
  --scrim:rgb(10 20 30 / .45);
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar:"IBM Plex Sans Arabic", "IBM Plex Sans", Tahoma, "Arial", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
  --rail:236px;
  --tabbar:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1419; --surface:#151d24; --surface-2:#1c262f; --line:#2a3741;
    --fg:#e2e9ee; --muted:#95a3ae;
    --ink:#86b6e2; --ink-hover:#a5c9ec; --on-ink:#0b1a27;
    --brass:#d8a956;
    --ok:#4cc28a; --warn:#f0a34c; --danger:#f2766b; --info:#7fb0ea;
    --paper:#e6e1d3; --paper-fg:#211f1a; --paper-line:#cbc3ad;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .3);
    --scrim:rgb(0 0 0 / .6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#151d24; --surface-2:#1c262f; --line:#2a3741;
  --fg:#e2e9ee; --muted:#95a3ae;
  --ink:#86b6e2; --ink-hover:#a5c9ec; --on-ink:#0b1a27;
  --brass:#d8a956;
  --ok:#4cc28a; --warn:#f0a34c; --danger:#f2766b; --info:#7fb0ea;
  --paper:#e6e1d3; --paper-fg:#211f1a; --paper-line:#cbc3ad;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .3);
  --scrim:rgb(0 0 0 / .6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
[dir="rtl"] body{font-family:var(--f-ar)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 1.65rem/1.2 var(--f-display);letter-spacing:-.01em}
h2{font:600 1.15rem/1.3 var(--f-display)}
h3{font-size:.95rem;font-weight:600}
[dir="rtl"] h1,[dir="rtl"] h2{font-family:var(--f-ar)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- Coque ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 1.15rem var(--f-display);color:var(--fg);text-decoration:none;margin-inline-end:auto}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font:700 .95rem var(--f-display)}
.brand small{font:500 .72rem var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.net{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:600;cursor:pointer}
.net .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.net.off{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.net.off .dot{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.net .q{font-family:var(--f-mono);font-size:.72rem;padding:0 6px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:.8rem;font-weight:600;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.who{display:none;align-items:center;gap:8px;font-size:.85rem}
.avatar{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--brass) 22%,var(--surface));color:var(--brass);display:grid;place-items:center;font-weight:700;font-size:.8rem}

.shell{display:block}
.rail{display:none}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button,.rail button{border:0;background:none;cursor:pointer;color:var(--muted)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;font-size:.72rem;font-weight:600;position:relative}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar svg,.rail svg{width:22px;height:22px}
.badge-n{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font:600 .68rem/18px var(--f-mono)}
main{padding:20px 16px calc(var(--tabbar) + 28px);max-width:1180px;margin-inline:auto;min-width:0}

@media (min-width:960px){
  .shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
  .tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-inline-end:1px solid var(--line);background:var(--surface);position:sticky;top:calc(57px + env(safe-area-inset-top,0px));height:calc(100vh - 57px);align-self:start}
  .rail button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-weight:600;font-size:.92rem;text-align:start}
  .rail button:hover{background:var(--surface-2);color:var(--fg)}
  .rail button[aria-current="page"]{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink)}
  .rail .badge-n{position:static;margin-inline-start:auto}
  .rail-foot{margin-top:auto;padding:12px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line)}
  main{padding:28px 32px 48px}
  .who{display:flex}
}

/* ---------- Composants ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{background:var(--ink-hover)}
.btn.danger{color:var(--danger)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;cursor:pointer}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip.cours{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}
.chip.juge{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.chip.appel{background:color-mix(in srgb,var(--brass) 16%,transparent);color:var(--brass)}
.chip.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.chip.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.chip.line{border-color:var(--line);color:var(--muted)}
.chip.danger{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin-bottom:20px}
.page-head .grow{flex:1 1 260px;min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;margin-bottom:8px}
.back:hover{color:var(--ink)}
[dir="rtl"] .back svg,[dir="rtl"] .flip{transform:scaleX(-1)}
.section{display:grid;gap:12px;margin-top:26px}
.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-head h2{margin-inline-end:auto}

/* Recherche */
.search{position:relative;flex:1 1 320px;min-width:0}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:.95rem}
[dir="rtl"] .search input{padding:11px 40px 11px 14px}
.search svg{position:absolute;inset-inline-start:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}
.search .perf{position:absolute;inset-inline-end:12px;top:50%;translate:0 -50%;font:500 .7rem var(--f-mono);color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Tableau dossiers */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:start;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.role{font:500 .9rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
mark{background:color-mix(in srgb,var(--brass) 30%,transparent);color:inherit;border-radius:2px}
.list-cards{display:grid;gap:10px}
.dcard{display:grid;gap:6px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:start;width:100%}
.dcard .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.dcard .parties{font-weight:600}
.dcard .meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.only-desktop{display:none}
@media (min-width:760px){.only-desktop{display:block}.only-mobile{display:none}}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* Formulaires */
.form{display:grid;gap:18px;max-width:720px}
.field{display:grid;gap:6px}
.field label,.field .label{font-weight:600;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.field label .ar,.field .label .ar{font-weight:500;color:var(--muted)}
.req{color:var(--danger)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.95rem}
textarea.input{min-height:96px;resize:vertical;line-height:1.6}
.input[aria-invalid="true"]{border-color:var(--danger)}
.hint{font-size:.8rem;color:var(--muted)}
.hint.err{color:var(--danger);font-weight:600}
.hint.warn{color:var(--warn)}
.grid2{display:grid;gap:18px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;flex:1 1 120px;display:grid;justify-items:center;gap:1px;padding:10px 8px;cursor:pointer;font-weight:600;font-size:.88rem;text-align:center;border-inline-end:1px solid var(--line)}
.seg label:last-child{border-inline-end:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label .ar{font-weight:500;font-size:.8rem;color:var(--muted)}
.seg label:has(input:checked){background:var(--ink);color:var(--on-ink)}
.seg label:has(input:checked) .ar{color:inherit;opacity:.85}
.seg label:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:-3px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px}
.phrases{display:flex;gap:6px;flex-wrap:wrap;direction:rtl}
.phrases button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font:500 .8rem var(--f-ar);cursor:pointer;color:var(--muted)}
.phrases button:hover{color:var(--ink);border-color:var(--ink)}

/* Fiche dossier */
.case-head{display:grid;gap:14px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.case-head .row1{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.case-head .rolebig{font:500 1.5rem var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.case-head .facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fact .eyebrow{display:block;margin-bottom:2px}
.fact .v{font-weight:600}
.channels{display:grid;gap:12px}
@media (min-width:760px){.channels{grid-template-columns:1.4fr 1fr}}
.drop{display:grid;place-items:center;gap:8px;text-align:center;padding:26px 16px;border:2px dashed var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;min-height:150px;transition:border-color .15s, background .15s}
.drop:hover,.drop.over{border-color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,var(--surface))}
.drop svg{width:30px;height:30px;color:var(--ink)}
.camera{display:grid;place-items:center;gap:8px;text-align:center;padding:22px 16px;border-radius:var(--r);background:var(--ink);color:var(--on-ink);border:0;cursor:pointer;min-height:150px}
.camera svg{width:32px;height:32px}
.camera .small{opacity:.8}
@media (max-width:759px){.channels .camera{order:-1}}
.pieces{display:grid;gap:8px}
.piece{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.piece .thumb{width:44px;height:56px;border-radius:4px;background:var(--paper);border:1px solid var(--paper-line);display:grid;place-items:center;font:600 .62rem var(--f-mono);color:var(--paper-fg);overflow:hidden;text-transform:uppercase}
.piece .thumb img{width:100%;height:100%;object-fit:cover}
.piece .t{font-weight:600;overflow-wrap:anywhere}
.piece .m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted);margin-top:3px}
.piece .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
@media (min-width:760px){.piece{grid-template-columns:auto minmax(0,1fr) auto}.piece .acts{grid-column:auto}}

/* Audiences */
.day{display:grid;gap:8px;margin-top:18px}
.day:first-child{margin-top:0}
.day-label{display:flex;align-items:baseline;gap:10px;font-weight:600}
.day-label .muted{font-weight:500;font-size:.82rem}
.hcard{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 14px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:start;width:100%;cursor:pointer;position:relative}
.hcard:hover{border-color:color-mix(in srgb,var(--ink) 45%,var(--line))}
.hcard .time{grid-row:span 3;font:500 1.3rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.1}
.hcard .time small{display:block;font:500 .72rem var(--f-body);color:var(--muted);margin-top:4px}
.hcard .l1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.hcard .client{font-weight:600}
.hcard .l2{font-size:.85rem;color:var(--muted)}
.hcard .l3{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.hcard.dirty{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 5%,var(--surface))}
.hcard.done .time{color:var(--muted)}
.cache-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);font-size:.83rem;color:var(--muted);margin-bottom:16px}
.cache-note.off{background:color-mix(in srgb,var(--warn) 12%,var(--surface));color:var(--fg)}
.cache-note svg{width:18px;height:18px;flex:none}
.hearing-sum{display:grid;gap:4px;padding:14px;border-radius:var(--r);background:var(--surface-2);margin-bottom:20px}

/* Écran scindé */
.tr-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.tr-head .grow{flex:1 1 240px;min-width:0}
.tr-title{font:600 1.2rem var(--f-display)}
.langsel{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langsel button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--muted)}
.langsel button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.paneswitch{display:flex;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.paneswitch button{flex:1;border:0;background:var(--surface);padding:9px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.paneswitch button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.pane{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;min-width:0;min-height:520px}
.pane-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pane-bar .label{font-weight:600;font-size:.85rem;margin-inline-end:auto}
.vbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:32px;height:30px;padding:0 8px;cursor:pointer;font-weight:600;display:inline-grid;place-items:center}
.vbtn:hover{background:var(--surface-2)}
.vbtn svg{width:16px;height:16px}
.zoomv{font:500 .78rem var(--f-mono);min-width:44px;text-align:center;color:var(--muted)}
.viewport{flex:1;overflow:auto;background:var(--surface-2);padding:22px 16px;display:flex;justify-content:center;align-items:flex-start;max-height:72vh}
.paper-wrap{width:100%;max-width:540px;transform-origin:top center;transition:transform .2s}
.paper{width:100%;background:var(--paper);color:var(--paper-fg);padding:clamp(18px,5%,34px) clamp(16px,6%,34px) 44px;box-shadow:0 2px 6px rgb(0 0 0 / .12), 0 12px 30px rgb(0 0 0 / .08);direction:rtl;font:400 .95rem/2 var(--f-ar);position:relative;user-select:text}
.paper .hdr{display:flex;justify-content:space-between;font-size:.8rem;line-height:1.6;border-bottom:1px solid var(--paper-line);padding-bottom:10px;margin-bottom:14px}
.paper .ttl{text-align:center;font-weight:600;font-size:1.05rem;margin:4px 0 12px}
.paper p{margin:0 0 8px;text-align:justify}
.paper .seal{position:absolute;inset-inline-start:34px;bottom:26px;width:84px;height:84px;border-radius:50%;border:2px solid color-mix(in srgb,#2c4f8a 70%,transparent);color:color-mix(in srgb,#2c4f8a 80%,transparent);display:grid;place-items:center;text-align:center;font-size:.6rem;line-height:1.3;rotate:-12deg}
.paper img{display:block;width:100%;height:auto}
.paper.img{padding:10px}
.ai-tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line)}
.ai-tabs button{border:0;background:none;padding:9px 12px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ai-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ai-body{padding:16px;flex:1;overflow:auto;max-height:72vh}
.ai-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.summary{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.summary li{position:relative;padding:10px 12px 10px 34px;border:1px solid transparent;border-radius:8px;background:var(--surface-2);line-height:1.55;cursor:text}
[dir="rtl"] .summary li{padding:10px 34px 10px 12px}
.summary li::before{content:"";position:absolute;inset-inline-start:14px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.summary li:hover{border-color:var(--line)}
.summary li:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.rte-bar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.rte-bar .sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.gloss{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:.78rem}
.gloss button{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:.76rem;cursor:pointer}
.gloss button:hover{border-color:var(--ink);color:var(--ink)}
.gloss button .ar{color:var(--muted)}
.rte{min-height:320px;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);line-height:1.75;font-size:.94rem}
.rte:focus{outline:none;border-color:var(--ink)}
.rte p{margin:0 0 10px}
.rte p.c{text-align:center;font-weight:600}
.actionbar{position:sticky;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px));z-index:5;margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.actionbar .grow{flex:1 1 220px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
@media (min-width:960px){.actionbar{bottom:16px}}
@media (min-width:900px){
  .split{grid-template-columns:1fr 1fr}
  .paneswitch{display:none}
  .split .pane{display:flex!important}
}
@media (max-width:899px){
  .split[data-pane="original"] .pane-ai{display:none}
  .split[data-pane="ai"] .pane-orig{display:none}
}
.pipeline{display:grid;gap:12px;padding:24px 8px;max-width:420px;margin-inline:auto}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
.step .ic{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.step.run{color:var(--fg)}
.step.run .ic{border-color:var(--ink);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{color:var(--fg)}
.step.done .ic{border-color:var(--ok);background:var(--ok)}
.step.skip .ic{border-style:dashed}
.step .ms{font:500 .75rem var(--f-mono)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .4s}
@keyframes spin{to{transform:rotate(360deg)}}

/* Synchro */
.sync-grid{display:grid;gap:14px}
@media (min-width:860px){.sync-grid{grid-template-columns:1fr 1fr}}
.panel{padding:16px;display:grid;gap:10px;align-content:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
pre.payload{margin:0;padding:10px 12px;border-radius:8px;background:var(--surface-2);font:400 .76rem/1.5 var(--f-mono);overflow-x:auto;white-space:pre}
.qitem{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:8px}

/* Modale & toast */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:end center;padding:0}
@media (min-width:640px){.scrim{place-items:center;padding:24px}}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;box-shadow:var(--shadow)}
@media (min-width:640px){.modal{border-radius:14px;padding:22px}}
.modal.wide{max-width:720px}
.modal-head{display:flex;align-items:flex-start;gap:12px}
.modal-head h2{margin-inline-end:auto}
.lang-opts{display:grid;gap:10px}
.lang-opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:start;width:100%}
.lang-opt:hover{border-color:var(--ink)}
.lang-opt .code{width:38px;height:38px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font:600 .85rem var(--f-mono)}
.lang-opt .grow{flex:1}
.crop{position:relative;border-radius:8px;overflow:hidden;background:#111;max-width:100%}
.crop canvas{display:block;width:100%;height:auto}
.crop .frame{position:absolute;inset:6%;border:2px solid #4fd18b;box-shadow:0 0 0 9999px rgb(0 0 0 / .45)}
.crop .frame i{position:absolute;width:14px;height:14px;background:#4fd18b;border-radius:50%}
.crop .frame i:nth-child(1){top:-8px;left:-8px}.crop .frame i:nth-child(2){top:-8px;right:-8px}.crop .frame i:nth-child(3){bottom:-8px;left:-8px}.crop .frame i:nth-child(4){bottom:-8px;right:-8px}
.toggle-row{display:flex;align-items:center;gap:8px;font-size:.88rem}
.readonly{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toasts{position:fixed;z-index:60;inset-inline:0;bottom:calc(var(--tabbar) + 14px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;padding-inline:16px}
@media (min-width:960px){.toasts{bottom:24px}}
.toast{pointer-events:auto;max-width:520px;padding:11px 16px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:.88rem;font-weight:500;box-shadow:var(--shadow);animation:up .25s ease-out}
.toast.warn{background:var(--warn);color:#fff}
.toast.ok{background:var(--ok);color:#fff}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.syncbanner{display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--info) 14%,var(--surface));color:var(--fg);font-size:.86rem;font-weight:600;border-bottom:1px solid var(--line)}
.syncbanner .ic{width:16px;height:16px;border-radius:50%;border:2px solid var(--info);border-top-color:transparent;animation:spin .8s linear infinite}
.demo-note{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================= État & persistance ================= */
let state;
function load(){
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { saved = null; }
  const data = saved && saved.v === 1 ? saved.data : seed();
  state = {...data, lang: (saved && saved.lang) || 'fr', online: true, view:{name:'dossiers'}, filter:'all', q:'', agendaMode:'day', pane:'ai', aiTab:'summary', zoom:1, rot:0, pipelineToken:0};
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE, JSON.stringify({v:1, lang:state.lang, data:{dossiers:state.dossiers, hearings:state.hearings, queue:state.queue, cacheAt:state.cacheAt}})); }
    catch (e) { /* stockage indisponible ou plein : le prototype continue en mémoire */ }
  }, 250);
}
const dossier = id => state.dossiers.find(d => d.id === id);
const liveDocs = d => d.docs.filter(x => !x.deleted);

/* ================= Navigation ================= */
function go(name, params = {}){
  state.pipelineToken++;
  state.view = {name, ...params};
  if (name === 'traduction') { state.zoom = 1; state.rot = 0; state.aiTab = 'summary'; state.pane = 'ai'; }
  render();
  window.scrollTo({top:0});
}
function navItems(){
  const n = state.queue.length;
  return [
    {k:'dossiers', icon:ICON.folder, label:t('dossiers'), match:['dossiers','nouveau','fiche','traduction']},
    {k:'agenda', icon:ICON.cal, label:t('agenda'), match:['agenda','cr']},
    {k:'synchro', icon:ICON.sync, label:t('sync'), match:['synchro'], badge:n},
  ];
}
function renderNav(){
  const items = navItems();
  const html = items.map(i => `<button type="button" data-nav="${i.k}" ${i.match.includes(state.view.name) ? 'aria-current="page"' : ''}>${i.icon}<span>${esc(i.label)}</span>${i.badge ? `<span class="badge-n">${i.badge}</span>` : ''}</button>`).join('');
  $('#tabbar').innerHTML = html;
  $('#rail').innerHTML = html + `<div class="rail-foot">Prototype UI — Lot 01 Espace Avocat.<br>Données fictives, IA simulée.</div>`;
  const net = $('#net');
  net.className = 'net' + (state.online ? '' : ' off');
  net.innerHTML = `<span class="dot"></span><span>${t(state.online ? 'online' : 'offline')}</span>${state.queue.length ? `<span class="q">${state.queue.length}</span>` : ''}`;
  $('#langBtn').textContent = state.lang === 'ar' ? 'FR' : 'ع';
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
}
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) go(nav.dataset.nav);
});
$('#brand').addEventListener('click', e => { e.preventDefault(); go('dossiers'); });
$('#langBtn').addEventListener('click', () => { state.lang = state.lang === 'ar' ? 'fr' : 'ar'; applyLang(); save(); render(); });
function applyLang(){ document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr'; }

/* ================= Rendu ================= */
function render(){
  renderNav();
  const v = state.view, root = $('#view');
  const views = {dossiers:viewDossiers, nouveau:viewForm, fiche:viewFiche, traduction:viewTraduction, agenda:viewAgenda, cr:viewCR, synchro:viewSync};
  (views[v.name] || viewDossiers)(root);
}

/* ---------- Écran A : Tableau de bord ---------- */
function statusChip(s){ const m = {cours:'cours', juge:'juge', appel:'appel'}; return `<span class="chip ${m[s]}">${esc(t('st_' + s))}</span>`; }
function hl(text, q){
  const s = esc(text); if (!q) return s;
  const i = text.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return s;
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function nextHearing(d){ return state.hearings.filter(h => h.dossierId === d.id && h.status === 'prevue' && daysFrom(h.date) >= 0).sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time))[0]; }
function viewDossiers(root){
  const counts = {all:state.dossiers.length}; state.dossiers.forEach(d => counts[d.statut] = (counts[d.statut] || 0) + 1);
  root.innerHTML = `
    <div class="page-head"><div class="grow"><div class="eyebrow">Cabinet Haddad · ${state.dossiers.length} affaires</div><h1>${esc(t('dash'))}</h1></div>
      <button class="btn primary" type="button" id="newBtn">${ICON.plus}${esc(t('newCase'))}</button></div>
    <div class="toolbar">
      <label class="search">${ICON.search}<input id="q" type="search" placeholder="${esc(t('searchPh'))}" value="${esc(state.q)}" autocomplete="off" aria-label="Recherche"><span class="perf" id="perf"></span></label>
      <div class="filters" role="group" aria-label="Filtrer par statut">
        ${['all','cours','juge','appel'].map(k => `<button type="button" data-filter="${k}" aria-pressed="${state.filter === k}">${esc(k === 'all' ? t('all') : t('st_' + k))} <span class="mono">${counts[k] || 0}</span></button>`).join('')}
      </div>
    </div>
    <div id="results"></div>`;
  $('#newBtn').onclick = () => go('nouveau');
  const q = $('#q');
  q.oninput = () => { state.q = q.value; renderResults(); };
  $$('[data-filter]').forEach(b => b.onclick = () => { state.filter = b.dataset.filter; $$('[data-filter]').forEach(x => x.setAttribute('aria-pressed', x === b)); renderResults(); });
  renderResults();
}
function renderResults(){
  const t0 = performance.now();
  const q = state.q.trim().toLowerCase();
  const rows = state.dossiers.filter(d => (state.filter === 'all' || d.statut === state.filter) &&
    (!q || [d.client, d.adverse, d.role, court(d.court).fr, court(d.court).short, court(d.court).ar].some(x => x.toLowerCase().includes(q))))
    .sort((a, b) => b.last.localeCompare(a.last));
  const qq = state.q.trim();
  const el = $('#results');
  if (!rows.length) { el.innerHTML = `<div class="empty card">Aucune affaire ne correspond à « ${esc(qq)} ».<br><button class="link" type="button" id="clearQ">Effacer la recherche</button></div>`; $('#clearQ').onclick = () => { state.q = ''; $('#q').value = ''; renderResults(); }; }
  else el.innerHTML = `
    <div class="only-desktop table-wrap"><table>
      <thead><tr><th>N° Rôle</th><th>Client</th><th>Partie adverse</th><th>Tribunal</th><th>Dernière activité</th><th>Statut</th></tr></thead>
      <tbody>${rows.map(d => `<tr class="row" data-open="${d.id}" tabindex="0"><td class="role">${hl(d.role, qq)}</td><td><b>${hl(d.client, qq)}</b></td><td>${hl(d.adverse, qq)}</td><td>${hl(court(d.court).short, qq)}</td><td class="mono small">${esc(fmtDate(d.last))}</td><td>${statusChip(d.statut)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="only-mobile list-cards">${rows.map(d => { const nh = nextHearing(d); return `
      <button class="dcard" type="button" data-open="${d.id}">
        <span class="top"><span class="role">${hl(d.role, qq)}</span>${statusChip(d.statut)}</span>
        <span class="parties">${hl(d.client, qq)} <span class="muted">c.</span> ${hl(d.adverse, qq)}</span>
        <span class="meta"><span>${hl(court(d.court).short, qq)}</span><span>Activité : ${esc(fmtDate(d.last, {day:'numeric', month:'short'}))}</span>${nh ? `<span style="color:var(--ink);font-weight:600">Audience ${esc(relDay(nh.date))} · ${esc(nh.time)}</span>` : ''}</span>
      </button>`; }).join('')}</div>`;
  $$('[data-open]', el).forEach(r => { r.onclick = () => go('fiche', {id:r.dataset.open}); r.onkeydown = e => { if (e.key === 'Enter') go('fiche', {id:r.dataset.open}); }; });
  const p = $('#perf'); if (p) p.textContent = q ? `${rows.length} · ${(performance.now() - t0).toFixed(1)} ms` : '';
}

/* Upload : validation, assainissement, filtre OCR */
const ALLOWED = ['pdf','jpg','jpeg','png'];
function sanitize(name){
  const base = name.replace(/\.[^.]+$/, '');
  return base.normalize('NFKC').replace(/[^\p{L}\p{N}\-_ ]+/gu, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'Piece';
}
function startUpload(file, kind, d){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const isImg = file.type.startsWith('image/');
  if (!ALLOWED.includes(ext) && !(kind === 'photo' && isImg)) return toast(`Format .${ext || '?'} refusé. Formats acceptés : PDF, JPG, JPEG, PNG.`, 'warn');
  if (file.size > 10 * 1024 * 1024) return toast(`Fichier trop lourd (${(file.size / 1048576).toFixed(1)} Mo). Limite : 10 Mo.`, 'warn');
  const finalExt = ALLOWED.includes(ext) ? ext : 'jpg';
  if (!isImg) return uploadModal({file, kind, d, ext:finalExt, img:null});
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => { uploadModal({file, kind, d, ext:finalExt, img:im}); };
  im.onerror = () => toast('Image illisible. Réessayez avec un autre fichier.', 'warn');
  im.src = url;
}
// RG-DOS-03 : niveaux de gris + normalisation du contraste (étirement d'histogramme)
function processImage(img, crop, filter){
  const max = 1100;
  const sx = crop ? img.naturalWidth * .06 : 0, sy = crop ? img.naturalHeight * .06 : 0;
  const sw = img.naturalWidth - 2 * sx, sh = img.naturalHeight - 2 * sy;
  const k = Math.min(1, max / Math.max(sw, sh));
  const cv = document.createElement('canvas'); cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
  const ctx = cv.getContext('2d'); ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  if (filter) {
    const id = ctx.getImageData(0, 0, cv.width, cv.height), p = id.data; let lo = 255, hi = 0;
    const g = new Uint8ClampedArray(p.length / 4);
    for (let i = 0, j = 0; i < p.length; i += 4, j++) { const v = .299 * p[i] + .587 * p[i+1] + .114 * p[i+2]; g[j] = v; }
    const hist = new Uint32Array(256); g.forEach(v => hist[v]++);
    const cut = g.length * .01; let acc = 0;
    for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > cut) { lo = v; break; } }
    acc = 0; for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > cut) { hi = v; break; } }
    const span = Math.max(1, hi - lo);
    for (let i = 0, j = 0; i < p.length; i += 4, j++) { const v = (g[j] - lo) * 255 / span; p[i] = p[i+1] = p[i+2] = v; }
    ctx.putImageData(id, 0, 0);
  }
  return cv;
}
function uploadModal({file, kind, d, ext, img}){

  const isPhoto = kind === 'photo';
  openModal(`
    <div class="modal-head"><div><div class="eyebrow">${isPhoto ? 'Canal 2 · Caméra smartphone' : 'Canal 1 · Upload classique'}</div><h2>Archiver la pièce</h2></div><button class="iconbtn" type="button" data-close>Fermer</button></div>
    ${img ? `<div class="crop" id="cropBox"><canvas id="pv"></canvas>${isPhoto ? '<div class="frame" id="frame"><i></i><i></i><i></i><i></i></div>' : ''}</div>

      </div>` : `<div class="readonly">${ICON.upload.replace('<svg', '<svg width="18" height="18"')} <b>${esc(file.name)}</b><span class="muted">${(file.size / 1024).toFixed(0)} Ko</span></div>`}

    <div class="field"><span class="label">Dossier de rattachement <span class="muted small" style="font-weight:500">non modifiable · RG-DOS-01</span></span>

    <div class="demo-note">Nom de stockage généré : <span class="mono">${esc(storage)}</span></div>
    <div class="form-actions"><button class="btn primary" type="button" id="doUp">Archiver dans ${esc(d.role)}</button><button class="btn" type="button" data-close>Annuler</button></div>`, 'wide');
  const draw = () => {

  };
  if (img) { draw(); $('#optFilt').onchange = draw; if (isPhoto) $('#optCrop').onchange = draw; }

    d.docs.unshift(doc); d.last = isoOff(0);

  };

function runPipeline(d, doc, lang, regen){
  const token = ++state.pipelineToken;
  const pane = $('#aiPane'), ab = $('#ab');
  const steps = [
    {k:'cache', label: regen ? 'Cache ignoré (régénération)' : 'Vérification du cache BDD', ms:180},
    {k:'ocr', label:'Extraction OCR arabe', ms:1500},
    {k:'llm', label:`Traduction et résumé (${lang === 'fr' ? 'français' : 'anglais'})`, ms:2300},
    {k:'db', label:'Sauvegarde · statut brouillon', ms:350},
  ];
  pane.innerHTML = `<div class="pane-bar"><span class="label">Assistant IA</span><span class="chip line">Traitement en cours</span></div>
    <div class="pipeline"><div class="bar"><i id="pbar"></i></div>${steps.map((s, i) => `<div class="step" id="st${i}"><span class="ic"></span><span>${esc(s.label)}</span><span class="ms"></span></div>`).join('')}
    <div class="demo-note">Simulation du pipeline. En production : Cloud Vision (OCR) puis LLM, appelés par le backend .NET.</div></div>`;
  ab.innerHTML = `<div class="grow"><span class="chip line">En attente du résultat</span></div><button class="btn" type="button" disabled>Régénérer</button><button class="btn primary" type="button" disabled>Publier pour le client</button>`;
  const total = steps.reduce((a, s) => a + s.ms, 0); let elapsed = 0, i = 0;
  const next = () => {
    if (token !== state.pipelineToken) return;
    if (i > 0) { const p = $('#st' + (i - 1)); p.className = 'step done' + (regen && i === 1 ? ' skip' : ''); p.querySelector('.ms').textContent = steps[i - 1].ms + ' ms'; }
    if (i === steps.length) {
      doc.tr[lang] = {...aiContent(doc, d, lang), status:'draft', edited:false, editedBy:null, at:isoOff(0)};
      d.last = isoOff(0); save();
      return setTimeout(() => token === state.pipelineToken && renderAI(d, doc, lang, {cached:false, ms:total}), 250);
    }
    $('#st' + i).className = 'step run';
    elapsed += steps[i].ms; $('#pbar').style.width = (elapsed / total * 100) + '%';
    setTimeout(next, steps[i++].ms);
  };
  next();
}

  $$('[data-tab]', pane).forEach(b => b.onclick = () => { state.aiTab = b.dataset.tab; $$('[data-tab]', pane).forEach(x => x.setAttribute('aria-selected', x === b)); $('#tabSummary').hidden = state.aiTab !== 'summary'; $('#tabFull').hidden = state.aiTab !== 'full'; });
  $$('.summary li', pane).forEach(li => {
    li.oninput = () => { tr.summary[+li.dataset.i] = li.textContent; markEdited(d, doc, lang); };
    li.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); li.blur(); } };
  });
  const rte = $('#rte');
  rte.oninput = () => { tr.full = rte.innerHTML; markEdited(d, doc, lang); };
  $$('[data-cmd]', pane).forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => { rte.focus(); document.execCommand(b.dataset.cmd); tr.full = rte.innerHTML; if (b.dataset.cmd !== 'undo') markEdited(d, doc, lang); }; });
  $$('[data-term]', pane).forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => {
    const sel = window.getSelection();
    if (!sel.rangeCount || !rte.contains(sel.anchorNode)) { rte.focus(); const r = document.createRange(); r.selectNodeContents(rte); r.collapse(false); sel.removeAllRanges(); sel.addRange(r); }
    document.execCommand('insertText', false, b.dataset.term); tr.full = rte.innerHTML; markEdited(d, doc, lang); }; });
  renderActionBar(d, doc, lang);
}
function markEdited(d, doc, lang){
  const tr = doc.tr[lang]; let changed = false;
  if (!tr.edited) { tr.edited = true; tr.editedBy = LAWYER; changed = true; }
  if (tr.status === 'validated_by_lawyer') { tr.status = 'draft'; changed = true; toast('Version modifiée après publication : elle repasse en brouillon et disparaît de l\'espace client jusqu\'à nouvelle validation.', 'warn'); }
  save();
  if (changed) renderActionBar(d, doc, lang);
}
function renderActionBar(d, doc, lang){
  const tr = doc.tr[lang], v = tr.status === 'validated_by_lawyer';
  $('#ab').innerHTML = `
    <div class="grow">
      ${tr.edited ? `<span class="chip appel">Modifié par ${esc(tr.editedBy || LAWYER)}</span>` : `<span class="chip neutral">Généré par l'IA</span>`}
      ${v ? `<span class="chip ok">Visible par le client</span>` : `<span class="chip warn">${ICON.lock} Brouillon · invisible pour le client</span>`}
    </div>
    <button class="btn" type="button" id="regen">Régénérer</button>
    <button class="btn ${v ? '' : 'ok'}" type="button" id="pub" ${v ? 'disabled' : ''}>${v ? 'Publiée' : 'Publier pour le client'}</button>`;
  $('#regen').onclick = () => confirmModal('Régénérer la traduction ?', 'Le pipeline OCR + IA sera relancé sans passer par le cache. La version actuelle, y compris vos corrections, sera écrasée.', 'Régénérer', () => { delete doc.tr[lang]; save(); runPipeline(d, doc, lang, true); }, true);
  $('#pub').onclick = () => { tr.status = 'validated_by_lawyer'; tr.validatedAt = new Date().toISOString(); d.last = isoOff(0); save(); renderActionBar(d, doc, lang); toast(`Publié : le résumé et la traduction (${lang.toUpperCase()}) sont visibles dans l'espace de ${d.client}.`, 'ok'); };
}

/* ---------- Agenda ---------- */
function reminders(h){
  if (h.status !== 'prevue') return '';
  const n = daysFrom(h.date); if (n < 0) return '';
  const s3 = n <= 3, s1 = n <= 1;
  return `<span class="chip ${s3 ? 'ok' : 'line'}">SMS J-3 · ${s3 ? 'envoyé' : 'planifié'}</span><span class="chip ${s1 ? 'ok' : 'line'}">Push J-1 · ${s1 ? 'envoyé' : 'planifié'}</span>`;
}
function hearingCard(h){
  const d = dossier(h.dossierId); if (!d) return '';
  const st = H_STATUS[h.status];
  return `<button class="hcard ${h.dirty ? 'dirty' : ''} ${h.status !== 'prevue' ? 'done' : ''}" type="button" data-h="${h.id}">
    <span class="time">${esc(h.time)}<small>${esc(fmtDate(h.date, {day:'numeric', month:'short'}))}</small></span>
    <span class="l1"><span class="role">${esc(d.role)}</span><span class="client">${esc(d.client)}</span></span>
    <span class="l2">${esc(court(d.court).short)} · ${esc(h.salle)}</span>
    <span class="l3"><span class="chip ${st.cls}">${esc(st.fr)} <span class="ar">${esc(st.ar)}</span></span>${h.dirty ? '<span class="chip warn">Modifié localement</span>' : ''}${reminders(h)}</span>
  </button>`;
}
function bindHearingCards(root){ $$('[data-h]', root).forEach(b => b.onclick = () => go('cr', {id:b.dataset.h})); }
function viewAgenda(root){
  const mode = state.agendaMode;
  const horizon = mode === 'day' ? 0 : 6;
  const list = state.hearings.filter(h => { const n = daysFrom(h.date); return n >= 0 && n <= horizon; }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const byDay = {}; list.forEach(h => (byDay[h.date] = byDay[h.date] || []).push(h));
  const cacheTime = new Date(state.cacheAt).toLocaleTimeString(loc(), {hour:'2-digit', minute:'2-digit'});
  const todayCount = state.hearings.filter(h => daysFrom(h.date) === 0).length;
  root.innerHTML = `
    <div class="page-head"><div class="grow"><div class="eyebrow">${esc(fmtDay(isoOff(0)))}</div><h1>${esc(t('agendaT'))}</h1></div>
      <div class="langsel" role="group" aria-label="Période"><button type="button" data-m="day" aria-pressed="${mode === 'day'}">${esc(t('day'))} <span class="mono">${todayCount}</span></button><button type="button" data-m="week" aria-pressed="${mode === 'week'}">${esc(t('week'))}</button></div></div>
    <div class="cache-note ${state.online ? '' : 'off'}">${state.online ? ICON.cloud : ICON.cloudoff}
      <span>${state.online ? `Agenda des 30 prochains jours et dossiers en cache local · mis à jour à ${esc(cacheTime)}.` : `<b>Hors-ligne.</b> Vous consultez le cache local (mis à jour à ${esc(cacheTime)}). Les comptes-rendus seront synchronisés au retour du réseau.`}</span></div>
    ${list.length ? Object.entries(byDay).map(([date, hs]) => `<div class="day"><div class="day-label"><span>${esc(fmtDay(date))}</span><span class="muted">${esc(relDay(date))} · ${hs.length} audience${hs.length > 1 ? 's' : ''}</span></div>${hs.map(hearingCard).join('')}</div>`).join('')
      : `<div class="empty card">Aucune audience ${mode === 'day' ? "aujourd'hui" : 'sur les 7 prochains jours'}.</div>`}`;
  $$('[data-m]').forEach(b => b.onclick = () => { state.agendaMode = b.dataset.m; render(); });
  bindHearingCards(root);
}

/* ---------- Compte-rendu d'audience ---------- */
function viewCR(root){
  const h = state.hearings.find(x => x.id === state.view.id); if (!h) return go('agenda');
  const d = dossier(h.dossierId);
  const cur = h.status === 'prevue' ? '' : h.status;
  root.innerHTML = `
    <button class="back" type="button" data-nav="agenda">${ICON.back}${esc(t('agenda'))}</button>
    <div class="page-head"><div class="grow"><div class="eyebrow">Compte-rendu express</div><h1>Issue de l'audience</h1></div></div>
    <div class="hearing-sum"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="role">${esc(d.role)}</span><b>${esc(d.client)}</b><span class="muted">c. ${esc(d.adverse)}</span></div>
      <div class="muted small">${esc(court(d.court).fr)} · ${esc(h.salle)} · ${esc(fmtDay(h.date))} à ${esc(h.time)}</div></div>
    <form class="form" id="crf" novalidate>
      <div class="field"><span class="label" id="hsl">Statut de l'audience <span class="req">*</span></span>
        <div class="seg" role="radiogroup" aria-labelledby="hsl">
          ${['effectuee','reportee','deliberee'].map(k => `<label><input type="radio" name="hs" value="${k}" ${cur === k ? 'checked' : ''}><span>${esc(H_STATUS[k].fr)}</span><span class="ar">${esc(H_STATUS[k].ar)}</span></label>`).join('')}
        </div><span class="hint" id="hsHint"></span></div>
      <div class="field" id="dateField" ${cur === 'reportee' ? '' : 'hidden'}>
        <label for="nd">Nouvelle date d'audience <span class="ar">تاريخ الجلسة القادمة</span></label>
        <input class="input" type="date" id="nd" min="${h.date}" value="${h.nextDate || ''}"><span class="hint" id="ndHint">Le prochain passage sera ajouté à l'agenda et le client prévenu.</span></div>
      <div class="field"><label for="dec">Issue / Décision <span class="ar">منطوق القرار أو سبب التأجيل</span></label>
        <textarea class="input ar" id="dec" dir="rtl" lang="ar" placeholder="تأجيل لتقديم الجواب">${esc(h.decision)}</textarea>
        <div class="phrases">${AR_PHRASES.map(p => `<button type="button" data-ph="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>
      <div class="field"><label for="note">Note interne <span class="muted small" style="font-weight:500;display:inline-flex;gap:4px;align-items:center">${ICON.lock} non visible par le client</span></label>
        <textarea class="input" id="note" placeholder="Ex. : le confrère adverse a demandé un délai, prévoir les conclusions avant mardi.">${esc(h.note)}</textarea></div>
      <div class="form-actions"><button class="btn primary" type="submit">${state.online ? 'Enregistrer et synchroniser' : 'Enregistrer hors-ligne'}</button><button class="btn" type="button" data-nav="agenda">Annuler</button></div>
      ${state.online ? '' : `<div class="cache-note off">${ICON.cloudoff}<span>Pas de réseau : le compte-rendu sera stocké sur ce téléphone et envoyé automatiquement au retour de la 4G ou du Wi-Fi.</span></div>`}
    </form>`;
  const f = $('#crf');
  $$('input[name="hs"]').forEach(r => r.onchange = () => { $('#dateField').hidden = f.hs.value !== 'reportee'; $('#hsHint').textContent = ''; });
  $$('[data-ph]').forEach(b => b.onclick = () => { const ta = $('#dec'); ta.value = ta.value ? ta.value.trim() + '، ' + b.dataset.ph : b.dataset.ph; ta.focus(); });
  f.onsubmit = e => {
    e.preventDefault();
    const s = f.hs.value;
    if (!s) { const hh = $('#hsHint'); hh.className = 'hint err'; hh.textContent = 'Choisissez l\'issue de l\'audience.'; return; }
    const nd = $('#nd').value;
    if (s === 'reportee' && (!nd || nd <= h.date)) { const hh = $('#ndHint'); hh.className = 'hint err'; hh.textContent = 'Indiquez une date postérieure à l\'audience du ' + fmtDate(h.date) + '.'; $('#nd').focus(); return; }
    Object.assign(h, {status:s, decision:$('#dec').value.trim(), note:$('#note').value.trim(), updatedAt:new Date().toISOString()});
    if (s === 'reportee') {
      h.nextDate = nd;
      if (!state.hearings.some(x => x.dossierId === d.id && x.date === nd)) state.hearings.push({id:uid(), dossierId:d.id, date:nd, time:h.time, salle:h.salle, status:'prevue', decision:'', note:'', dirty:!state.online});
    }
    d.last = isoOff(0);
    if (state.online) { toast(`Compte-rendu synchronisé. ${d.client} est notifié par SMS et push.`, 'ok'); }
    else {
      h.dirty = true;
      state.queue = state.queue.filter(q => q.hearingId !== h.id);
      state.queue.push({id:uid(), hearingId:h.id, at:new Date().toISOString()});
      toast('Enregistré sur le téléphone. Synchronisation au retour du réseau.', 'warn');
    }
    save(); go('agenda');
  };
}

/* ---------- Synchronisation & mode hors-ligne ---------- */
function payload(q){
  const h = state.hearings.find(x => x.id === q.hearingId); if (!h) return '{}';
  return JSON.stringify({hearingId:h.id.slice(0, 8) + '…', status:h.status, nextHearingDate:h.status === 'reportee' ? h.nextDate : null, decisionAr:h.decision || null, internalNote:h.note ? '(privée)' : null, recordedOfflineAt:q.at.slice(0, 16).replace('T', ' ')}, null, 2);
}
function viewSync(root){
  const q = state.queue;
  root.innerHTML = `
    <div class="page-head"><div class="grow"><div class="eyebrow">Mode hors-ligne</div><h1>${esc(t('syncT'))}</h1></div>
      <button class="btn ${state.online ? '' : 'primary'}" type="button" id="toggleNet">${state.online ? 'Simuler la perte de réseau' : 'Simuler le retour du réseau'}</button></div>
    <div class="sync-grid">
      <div class="card panel"><h2>État de l'appareil</h2>
        <dl class="kv"><dt>Réseau</dt><dd style="color:var(${state.online ? '--ok' : '--warn'})">${state.online ? 'En ligne' : 'Hors-ligne'}</dd>
          <dt>Cache de lecture</dt><dd>${state.dossiers.length} dossiers · ${state.hearings.filter(h => daysFrom(h.date) >= 0 && daysFrom(h.date) <= 30).length} audiences (30 j)</dd>
          <dt>Dernière mise en cache</dt><dd class="mono">${esc(new Date(state.cacheAt).toLocaleString(loc(), {dateStyle:'short', timeStyle:'short'}))}</dd>
          <dt>File d'envoi</dt><dd>${q.length} modification${q.length > 1 ? 's' : ''} en attente</dd></dl>
        <p class="muted small" style="margin:0">Chaque matin, l'application télécharge les dossiers et l'agenda des 30 prochains jours. Les comptes-rendus saisis sans réseau sont marqués « modifié localement » puis envoyés par lot dès le retour de la connexion.</p>
      </div>
      <div class="card panel"><div class="section-head"><h2>File de synchronisation</h2><button class="btn sm primary" type="button" id="syncNow" ${!q.length || !state.online ? 'disabled' : ''}>Synchroniser</button></div>
        ${q.length ? q.map(x => { const h = state.hearings.find(y => y.id === x.hearingId); const d = h && dossier(h.dossierId); return `<div class="qitem"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="chip warn">POST /api/hearings/sync</span><span class="role">${esc(d ? d.role : '')}</span><span class="muted small">${esc(d ? d.client : '')}</span></div><pre class="payload">${esc(payload(x))}</pre></div>`; }).join('')
          : `<div class="empty" style="padding:18px 0">Aucune modification en attente.${state.online ? ' Passez hors-ligne puis saisissez un compte-rendu depuis l\'agenda pour tester.' : ''}</div>`}
      </div>
    </div>
    <div class="section"><div class="card panel"><h2>Données de démonstration</h2><p class="muted small" style="margin:0">Les dossiers, pièces et traductions de ce prototype sont fictifs et restent dans ce navigateur.</p><div><button class="btn danger sm" type="button" id="reset">Réinitialiser la démo</button></div></div></div>`;
  $('#toggleNet').onclick = () => setOnline(!state.online);
  $('#syncNow').onclick = () => flushQueue();
  $('#reset').onclick = () => confirmModal('Réinitialiser la démo ?', 'Toutes les affaires, pièces et traductions ajoutées seront remplacées par les données d\'exemple.', 'Réinitialiser', () => {
    const lang = state.lang; try { localStorage.removeItem(STORE); } catch (e) {}
    load(); state.lang = lang; applyLang(); save(); go('dossiers'); toast('Démo réinitialisée.');
  }, true);
}
function setOnline(on){
  if (state.online === on) return;
  state.online = on;
  if (on) { toast('Réseau rétabli.'); flushQueue(); } else toast('Réseau perdu : passage en mode hors-ligne.', 'warn');
  render();
}
let syncing = false;
function flushQueue(){
  if (syncing || !state.online || !state.queue.length) return;
  syncing = true;
  const n = state.queue.length;
  $('#syncText').textContent = `Synchronisation de ${n} modification${n > 1 ? 's' : ''} vers le serveur…`;
  $('#syncbanner').hidden = false;
  setTimeout(() => {
    syncing = false; $('#syncbanner').hidden = true;
    if (!state.online) return;
    state.queue.forEach(q => { const h = state.hearings.find(x => x.id === q.hearingId); if (h) h.dirty = false; });
    state.hearings.forEach(h => h.dirty = false);
    state.queue = []; state.cacheAt = new Date().toISOString(); save();
    toast(`${n} compte${n > 1 ? 's' : ''}-rendu${n > 1 ? 's' : ''} synchronisé${n > 1 ? 's' : ''}. Clients notifiés par SMS et push.`, 'ok');
    render();
  }, 1800);
}
$('#net').addEventListener('click', () => setOnline(!state.online));
window.addEventListener('online', () => setOnline(true));
window.addEventListener('offline', () => setOnline(false));

/* ---------- Modales & toasts ---------- */
let lastFocus = null;
function openModal(html, cls = ''){
  lastFocus = document.activeElement;
  $('#modalRoot').innerHTML = `<div class="scrim" id="scrim"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim' || e.target.closest('[data-close]')) closeModal(); });
  const first = $('#modalRoot .modal input, #modalRoot .modal button:not([data-close]), #modalRoot .modal select');
  if (first) first.focus();
}
function closeModal(){ $('#modalRoot').innerHTML = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#scrim')) closeModal(); });
function confirmModal(title, body, okLabel, onOk, danger){
  openModal(`<div class="modal-head"><h2>${esc(title)}</h2></div><p style="margin:0">${body}</p>
    <div class="form-actions"><button class="btn ${danger ? 'primary' : 'primary'}" type="button" id="cOk" ${danger ? 'style="background:var(--danger);border-color:var(--danger);color:#fff"' : ''}>${esc(okLabel)}</button><button class="btn" type="button" data-close>Annuler</button></div>`);
  $('#cOk').onclick = () => { closeModal(); onOk(); };
}
function toast(msg, kind = ''){
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ---------- Démarrage ---------- */
load(); applyLang(); render();
})();
</script>
<!--ARTIFACT-BODY-END-->
</body>
</html>
